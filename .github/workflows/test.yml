name: Test RLHF Code Generator

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest

    
    - name: Test API
      run: |
        python src/api.py > /tmp/api.log 2>&1 &
        sleep 5
        curl http://localhost:8000/health || exit 1
        pkill -f "python src/api.py"
